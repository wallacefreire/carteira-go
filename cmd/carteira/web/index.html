<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carteira</title>
<style>
:root {
  --fundo: #f5f6f8; --painel: #ffffff; --texto: #1c2430; --suave: #5f6b7a; --borda: #e3e6eb;
  --destaque: #1f5fbf; --destaque-texto: #ffffff; --ganho: #13804a; --perda: #c23a2b;
  --alerta-fundo: #fff4e0; --alerta-texto: #8a5300; --linha-par: #fafbfc; --sombra: 0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fundo: #12161c; --painel: #1b2129; --texto: #e6e9ee; --suave: #9aa5b3; --borda: #2c3440;
    --destaque: #5b9bff; --destaque-texto: #0d1117; --ganho: #3fbf7f; --perda: #ff7a6b;
    --alerta-fundo: #3a2c12; --alerta-texto: #ffc870; --linha-par: #1f262f; --sombra: none;
  }
}
:root[data-tema="escuro"] {
  --fundo: #12161c; --painel: #1b2129; --texto: #e6e9ee; --suave: #9aa5b3; --borda: #2c3440;
  --destaque: #5b9bff; --destaque-texto: #0d1117; --ganho: #3fbf7f; --perda: #ff7a6b;
  --alerta-fundo: #3a2c12; --alerta-texto: #ffc870; --linha-par: #1f262f; --sombra: none;
}
/* Cores das fatias do gráfico: ordem fixa (validada para daltonismo), cada ativo sempre com a mesma. */
:root {
  --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a; --serie-4: #eda100;
  --serie-5: #e87ba4; --serie-6: #008300; --serie-7: #6250d6; --serie-8: #e34948; --serie-outros: #9aa1ab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; --serie-4: #c98500;
    --serie-5: #d55181; --serie-6: #008300; --serie-7: #9085e9; --serie-8: #e66767; --serie-outros: #6b7480;
  }
}
:root[data-tema="escuro"] {
  --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; --serie-4: #c98500;
  --serie-5: #d55181; --serie-6: #008300; --serie-7: #9085e9; --serie-8: #e66767; --serie-outros: #6b7480;
}
* { box-sizing: border-box; }
/* gráfico de rosca da carteira */
.grafico { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.grafico svg { flex: none; width: 220px; height: 220px; }
.grafico path { stroke: var(--painel); stroke-width: 2; cursor: default; transition: opacity .15s; }
.grafico.foco path:not(.ativa) { opacity: .35; }
.grafico .centro-valor { font-size: 17px; font-weight: 650; fill: var(--texto); }
.grafico .centro-rotulo { font-size: 12px; fill: var(--suave); }
.legenda-grafico { flex: 1; min-width: 220px; max-width: 460px; margin: 0; padding: 0; list-style: none; }
.legenda-grafico li { display: grid; grid-template-columns: 12px 1fr auto 56px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 6px; }
.legenda-grafico li.ativa { background: var(--linha-par); }
.legenda-grafico i { width: 12px; height: 12px; border-radius: 3px; }
.legenda-grafico span:nth-child(3), .legenda-grafico span:nth-child(4) { text-align: right; font-variant-numeric: tabular-nums; }
.legenda-grafico span:nth-child(4) { color: var(--suave); }
.visoes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.visoes button[aria-pressed="true"] { background: var(--destaque); color: var(--destaque-texto); border-color: var(--destaque); }
.dica { position: fixed; z-index: 30; pointer-events: none; background: var(--painel); color: var(--texto); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
/* gráficos de linha da evolução */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 99px; }
.chips button i { width: 14px; height: 3px; border-radius: 2px; }
.chips button[aria-pressed="false"] { color: var(--suave); }
.chips button[aria-pressed="false"] i { opacity: .25; }
.chips button[aria-pressed="true"] { border-color: var(--texto); }
.controles-evolucao { display: flex; gap: 12px 20px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.controles-evolucao .visoes { margin: 0; }
.controles-evolucao > * { min-width: 0; max-width: 100%; }
.linha-grafico { position: relative; }
.linha-grafico svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.linha-grafico .eixo { font-size: 12px; fill: var(--suave); font-variant-numeric: tabular-nums; }
.linha-grafico .grade { stroke: var(--borda); stroke-width: 1; }
.linha-grafico .zero { stroke: var(--suave); stroke-width: 1; }
.linha-grafico .serie { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.linha-grafico .serie.principal { stroke-width: 2.75; }
.linha-grafico .rotulo-fim { font-size: 12px; fill: var(--texto); font-variant-numeric: tabular-nums; }
.linha-grafico .mira { stroke: var(--suave); stroke-width: 1; stroke-dasharray: 3 3; }
.linha-grafico .ponto { stroke: var(--painel); stroke-width: 2; }
.dica table { border-collapse: collapse; }
.dica td { padding: 1px 0 1px 12px; border: none; background: none !important; text-align: right; }
.dica td:first-child { padding-left: 0; text-align: left; position: static; }
.dica i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
td.destaque, th.destaque { font-weight: 650; }
html { background: var(--fundo); }
body { margin: 0; min-height: 100vh; background: var(--fundo); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--painel); border-bottom: 1px solid var(--borda); }
.topo { max-width: 1200px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topo h1 { font-size: 20px; margin: 0; flex: 1; }
.topo .data { color: var(--suave); font-size: 13px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); padding: 7px 12px; }
button.principal { background: var(--destaque); color: var(--destaque-texto); border-color: var(--destaque); font-weight: 600; }
button:disabled { opacity: .6; cursor: wait; }
nav { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
nav button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 12px; color: var(--suave); white-space: nowrap; }
nav button.ativa { color: var(--texto); border-bottom-color: var(--destaque); font-weight: 600; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; margin-bottom: 16px; }
section.bloco, .card { min-width: 0; }
@media (max-width: 600px) {
  .topo { gap: 8px; }
  .topo .data { display: none; }
  .topo h1 { font-size: 18px; }
  .card .valor { font-size: 18px; }
  main { padding: 12px; }
  section.bloco { padding: 12px; }
}
.card { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; box-shadow: var(--sombra); }
.card .rotulo { color: var(--suave); font-size: 13px; }
.card .valor { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card .sub { font-size: 13px; color: var(--suave); }
section.bloco { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--sombra); }
section.bloco h2 { font-size: 16px; margin: 0 0 10px; }
section.bloco h2 small { color: var(--suave); font-weight: 400; font-size: 13px; }
.rolagem { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--borda); }
th { color: var(--suave); font-weight: 600; font-size: 13px; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--painel); }
tbody tr:nth-child(even) td { background: var(--linha-par); }
tr.total td { font-weight: 650; border-bottom: none; }
.ganho { color: var(--ganho); } .perda { color: var(--perda); }
.etiqueta { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--alerta-fundo); color: var(--alerta-texto); margin-left: 6px; }
.barra { display: inline-block; width: 60px; height: 6px; background: var(--borda); border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--destaque); }
.barra i.acima { background: var(--alerta-texto); }
ul.notas { margin: 6px 0 0; padding-left: 18px; color: var(--suave); font-size: 13px; }
.aviso-topo { background: var(--alerta-fundo); color: var(--alerta-texto); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.aviso-topo span { flex: 1; }
.carregando { color: var(--suave); padding: 28px 0; display: flex; gap: 14px; align-items: center; }
.carregando p { margin: 0 0 2px; color: var(--texto); }
.giro { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 3px solid var(--borda); border-top-color: var(--destaque); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .giro { animation-duration: 3s; } }
.erro { color: var(--perda); padding: 12px 0; white-space: pre-wrap; }
.linha-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
input[type=text], select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); }
input[type=text] { flex: 1; min-width: 160px; }
td.clicavel { cursor: pointer; }
td.clicavel:hover { outline: 1px solid var(--destaque); outline-offset: -1px; }
td.sem { color: var(--suave); }
.ok { color: var(--ganho); font-weight: 600; } .nok { color: var(--perda); }
.nota-radar { font-weight: 650; }
th.ordenavel { cursor: pointer; user-select: none; }
th.ordenavel:hover, th.ordenada { color: var(--texto); }
.legenda { color: var(--suave); font-size: 13px; margin-top: 8px; }
h3.subtitulo { font-size: 15px; margin: 22px 0 8px; }
h3.subtitulo small { color: var(--suave); font-weight: 400; font-size: 13px; }
tr.subitem td { color: var(--suave); font-size: 13px; }
tr.subitem td:first-child { padding-left: 28px; }
/* painel lateral da memória de cálculo */
#painel { position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 100%); background: var(--painel); border-left: 1px solid var(--borda); box-shadow: -4px 0 20px rgba(0,0,0,.15); transform: translateX(100%); transition: transform .2s; z-index: 20; overflow-y: auto; padding: 18px; }
#painel.aberto { transform: none; }
#painel h3 { margin: 0 30px 4px 0; font-size: 17px; }
#painel .fechar, .modal .fechar { position: absolute; top: 12px; right: 12px; border: none; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--suave); }
#painel dl { margin: 12px 0 0; }
#painel dt { color: var(--suave); font-size: 13px; margin-top: 10px; }
#painel dd { margin: 2px 0 0; }
#painel table td { white-space: normal; text-align: left; }
#painel table td.num { text-align: right; white-space: nowrap; }
#painel .origem { color: var(--suave); font-size: 12px; }
/* modal (aviso de mês novo e resultado da importação) */
#fundo-modal { position: fixed; inset: 0; z-index: 30; background: rgba(10,15,25,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; }
#fundo-modal.aberto { display: flex; }
.modal { position: relative; background: var(--painel); border-radius: 14px; max-width: 480px; width: 100%; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.3); max-height: 90vh; overflow-y: auto; }
.modal h3 { margin: 0 30px 8px 0; }
.modal ol { padding-left: 20px; } .modal li { margin: 6px 0; }
.modal .acoes { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>Carteira</h1>
    <span class="data" id="data"></span>
    <button id="tema" title="Tema claro ou escuro">◐</button>
    <button class="principal" id="botao-importar">Importar</button>
    <input type="file" id="arquivo" accept=".xlsx" hidden>
  </div>
  <nav id="abas">
    <button data-aba="carteira" class="ativa">Carteira</button>
    <button data-aba="evolucao">Evolução</button>
    <button data-aba="proventos">Proventos</button>
    <button data-aba="agenda">Agenda</button>
    <button data-aba="indicadores">Indicadores</button>
    <button data-aba="radar">Radar</button>
  </nav>
</header>
<main id="conteudo"></main>

<aside id="painel" aria-hidden="true"><button class="fechar" aria-label="Fechar">×</button><div id="painel-corpo"></div></aside>
<div id="fundo-modal"><div class="modal" role="dialog" aria-modal="true"><button class="fechar" aria-label="Fechar">×</button><div id="modal-corpo"></div></div></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cor = (n) => (n > 0 ? "ganho" : n < 0 ? "perda" : "");
const sinal = (txt) => (txt.startsWith("-") ? "perda" : txt === "-" || /^0,0/.test(txt) ? "" : "ganho");
const lista = (titulo, itens) => (itens && itens.length ? `<p class="legenda"><b>${esc(titulo)}</b></p><ul class="notas">${itens.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : "");

// Cada aba guarda o que já carregou; "Importar" limpa tudo.
const cache = {};
let abaAtual = "carteira";

async function api(caminho, opcoes) {
  let r;
  try { r = await fetch(caminho, opcoes); } catch {
    throw new Error("sem conexão com o programa. Confira se o carteira.exe web está aberto e recarregue a página.");
  }
  let dados;
  try { dados = await r.json(); } catch { throw new Error(`resposta inesperada do servidor (HTTP ${r.status})`); }
  if (!r.ok) throw new Error(dados.erro || `HTTP ${r.status}`);
  return dados;
}

// htmlCarregando: animação + mensagem + segundos passados (atualizados pelo relógio abaixo).
function htmlCarregando(msg) {
  return `<div class="carregando"><span class="giro"></span><div><p>${esc(msg)}</p><small data-inicio="${Date.now()}">0 s</small></div></div>`;
}
function carregando(msg) { $("#conteudo").innerHTML = htmlCarregando(msg); }
setInterval(() => {
  document.querySelectorAll(".carregando [data-inicio]").forEach((el) => {
    const s = Math.floor((Date.now() - Number(el.dataset.inicio)) / 1000);
    el.textContent = s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`;
  });
}, 1000);
function erro(e) { $("#conteudo").innerHTML = `<p class="erro">Erro: ${esc(e.message)}</p>`; }

// ---------- abas ----------
$("#abas").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-aba]");
  if (b) abrirAba(b.dataset.aba);
});

const ABAS = ["carteira", "evolucao", "proventos", "agenda", "indicadores", "radar"];
function abrirAba(nome) {
  abaAtual = nome;
  history.replaceState(null, "", nome === "carteira" ? location.pathname : "#" + nome);
  for (const b of document.querySelectorAll("#abas button")) b.classList.toggle("ativa", b.dataset.aba === nome);
  fecharPainel();
  ({ carteira: abaCarteira, evolucao: abaEvolucao, proventos: abaProventos, agenda: abaAgenda, indicadores: abaIndicadores, radar: abaRadar })[nome]();
}

// ---------- Carteira ----------
async function abaCarteira() {
  if (!cache.posicao) {
    carregando("Buscando cotações…");
    try { cache.posicao = await api("/api/posicao"); } catch (e) { return erro(e); }
  }
  if (abaAtual !== "carteira") return;
  const d = cache.posicao;
  $("#data").textContent = d.data;
  if (d.vazia) {
    $("#conteudo").innerHTML = `<section class="bloco"><h2>Carteira vazia</h2><p>Importe o extrato de Movimentação da B3 (.xlsx) no botão <b>Importar extrato</b>.</p></section>`;
    return;
  }
  let h = "";
  if (d.mesNovo) h += `<div class="aviso-topo"><span>Mês novo: falta importar o extrato da B3.</span><button onclick="mostrarAvisoMes()">Como fazer</button></div>`;
  h += `<div class="cards">
    <div class="card"><div class="rotulo">Valor da carteira</div><div class="valor">R$ ${esc(d.total)}</div></div>
    <div class="card"><div class="rotulo">Resultado (cotação − custo)</div><div class="valor ${cor(d.resultadoTotalNum)}">R$ ${esc(d.resultadoTotal)}</div><div class="sub ${cor(d.resultadoTotalNum)}">${esc(d.resultadoTotalPct)}</div></div>
    <div class="card"><div class="rotulo">Proventos (últimos 12 meses)</div><div class="valor">R$ ${esc(d.proventos12m)}</div>${d.proventosDesde ? `<div class="sub">R$ ${esc(d.proventos)} desde ${esc(d.proventosDesde)}</div>` : ""}</div>
    <div class="card"><div class="rotulo">Resultado das vendas já feitas</div><div class="valor">R$ ${esc(d.realizado)}</div></div>
  </div>`;
  h += `<section class="bloco"><h2>Posição <small>valores em R$ · teto por ativo ${esc(d.teto)}</small></h2><div class="rolagem"><table>
    <thead><tr><th>Ativo</th><th>Qtd</th><th>Preço médio</th><th>Cotação</th><th>Valor</th><th>Resultado</th><th>%</th><th>Peso</th></tr></thead><tbody>`;
  for (const l of d.linhas) {
    const c = cor(l.resultadoNum);
    const barra = l.peso === "-" ? "" : `<span class="barra"><i class="${l.acimaTeto ? "acima" : ""}" style="width:${Math.min(100, l.pesoNum * 100)}%"></i></span>`;
    h += `<tr><td>${esc(l.ticker)}${l.acimaTeto ? `<span class="etiqueta">acima do teto</span>` : ""}</td><td>${esc(l.qtd)}</td><td>${esc(l.precoMedio)}</td><td>${esc(l.cotacao)}</td>
      <td>${esc(l.valor)}</td><td class="${c}">${esc(l.resultado)}</td><td class="${c}">${esc(l.resultadoPct)}</td><td>${esc(l.peso)}${barra}</td></tr>`;
  }
  h += `<tr class="total"><td>Total</td><td></td><td></td><td></td><td>${esc(d.total)}</td><td class="${cor(d.resultadoTotalNum)}">${esc(d.resultadoTotal)}</td><td class="${cor(d.resultadoTotalNum)}">${esc(d.resultadoTotalPct)}</td><td></td></tr></tbody></table></div>`;
  h += lista("Cotações", d.notas) + lista("Confira", d.avisos) + `</section>`;
  h += `<section class="bloco" id="bloco-grafico"></section>`;
  if (d.classes && d.classes.length) {
    h += `<section class="bloco"><h2>Por classe</h2><table><tbody>${d.classes.map((c) => `<tr><td>${esc(c.nome)}</td><td>${esc(c.valor)}</td><td>${esc(c.pct)}</td></tr>` +
      (c.itens || []).map((i) => `<tr class="subitem"><td>${esc(i.nome)}</td><td>${esc(i.valor)}</td><td>${esc(i.pct)}</td></tr>`).join("")).join("")}</tbody></table></section>`;
  }
  for (const x of d.dolar || []) {
    h += `<section class="bloco"><h2>${esc(x.ticker)} em dólar <small>quanto do resultado veio do ${esc(x.ticker)} e quanto do câmbio · dólar oficial (PTAX do Banco Central)</small></h2>
      <table><thead><tr><th></th><th>Nas compras</th><th>Hoje</th><th>Variação</th></tr></thead><tbody>
      <tr><td>${esc(x.ticker)} em US$</td><td>US$ ${esc(x.custoUSD)}</td><td>US$ ${esc(x.valorUSD)}</td><td class="${cor(x.parteAtivoNum)}">${esc(x.resultadoUSDPct)}</td></tr>
      <tr><td>Dólar (R$)</td><td>${esc(x.dolarCompra)} <small>médio</small></td><td>${esc(x.dolarHoje)} <small>${esc(x.diaDolarHoje)}</small></td><td class="${cor(x.parteCambioNum)}">${esc(x.cambioPct)}</td></tr>
      </tbody></table>
      <table style="margin-top:12px"><tbody>
      <tr><td>Do ${esc(x.ticker)} (preço em dólar)</td><td class="${cor(x.parteAtivoNum)}">R$ ${esc(x.parteAtivo)}</td></tr>
      <tr><td>Do câmbio</td><td class="${cor(x.parteCambioNum)}">R$ ${esc(x.parteCambio)}</td></tr>
      <tr class="total"><td>Resultado em R$</td><td class="${cor(x.resultadoNum)}">R$ ${esc(x.resultado)}</td></tr>
      </tbody></table>
      <details style="margin-top:10px"><summary>Memória de cálculo</summary><ul>${x.contas.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></details></section>`;
  }
  if (d.terceiros && d.terceiros.length) {
    h += `<section class="bloco"><h2>De terceiros <small>fora do total, dos pesos e da correlação</small></h2><table><tbody>
      ${d.terceiros.map((t) => `<tr><td>${esc(t.nome)}</td><td>${esc(t.qtd)}</td><td>${esc(t.valor)}</td></tr>`).join("")}
      ${d.totalTerceiros ? `<tr class="total"><td>Total</td><td></td><td>${esc(d.totalTerceiros)}</td></tr>` : ""}</tbody></table></section>`;
  }
  $("#conteudo").innerHTML = h;
  desenharGrafico(d);
}

// ---------- Gráfico de rosca da carteira ----------
const VISOES = [["geral", "Geral"], ["Renda variável", "Renda variável"], ["Renda fixa", "Renda fixa"]];
let visaoGrafico = "geral";
const moedaBR = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pctBR = (f) => (f * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";

// Fatia da rosca entre os ângulos a0 e a1 (radianos, 0 = topo, sentido horário).
function fatia(a0, a1, r, ri) {
  const p = (ang, raio) => [110 + raio * Math.sin(ang), 110 - raio * Math.cos(ang)];
  if (a1 - a0 >= 2 * Math.PI - 1e-6) a1 = a0 + 2 * Math.PI - 1e-4; // fatia única: quase o círculo todo
  const g = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = p(a0, r), [x1, y1] = p(a1, r), [x2, y2] = p(a1, ri), [x3, y3] = p(a0, ri);
  return `M${x0},${y0} A${r},${r} 0 ${g} 1 ${x1},${y1} L${x2},${y2} A${ri},${ri} 0 ${g} 0 ${x3},${y3} Z`;
}

function desenharGrafico(d) {
  const bloco = $("#bloco-grafico");
  if (!bloco) return;
  // Cor de cada ativo pela posição no total (maior primeiro): fixa nas três visões.
  // Mais de 8 ativos: os 7 maiores têm cor própria e o resto vira "Outros".
  const todos = d.linhas.filter((l) => l.valorNum > 0).sort((a, b) => b.valorNum - a.valorNum);
  const comCor = todos.length > 8 ? 7 : 8;
  const corDe = new Map(todos.map((l, i) => [l.ticker, i < comCor ? `var(--serie-${i + 1})` : "var(--serie-outros)"]));
  const totalGeral = todos.reduce((s, l) => s + l.valorNum, 0);

  const doGrupo = visaoGrafico === "geral" ? todos : todos.filter((l) => l.grupo === visaoGrafico);
  const fatias = [];
  let outros = 0;
  for (const l of doGrupo) {
    if (corDe.get(l.ticker) === "var(--serie-outros)") outros += l.valorNum;
    else fatias.push({ nome: l.ticker, valor: l.valorNum, cor: corDe.get(l.ticker) });
  }
  if (outros > 0) fatias.push({ nome: "Outros", valor: outros, cor: "var(--serie-outros)" });
  const total = fatias.reduce((s, f) => s + f.valor, 0);

  const somaGrupo = (g) => todos.filter((l) => l.grupo === g).reduce((s, l) => s + l.valorNum, 0);
  let h = `<h2>Distribuição <small>${visaoGrafico === "geral" ? `renda variável ${pctBR(somaGrupo("Renda variável") / totalGeral)} · renda fixa ${pctBR(somaGrupo("Renda fixa") / totalGeral)}` : "parte da carteira"}</small></h2>
    <div class="visoes" role="group" aria-label="O que mostrar">${VISOES.map(([v, rot]) => `<button data-visao="${esc(v)}" aria-pressed="${visaoGrafico === v}">${esc(rot)}</button>`).join("")}</div>`;
  if (!total) {
    bloco.innerHTML = h + `<p class="legenda">Nenhum ativo de ${esc(visaoGrafico.toLowerCase())} na carteira.</p>`;
    ligarVisoes(d);
    return;
  }
  let ang = 0, svg = "";
  fatias.forEach((f, i) => {
    const a1 = ang + (f.valor / total) * 2 * Math.PI;
    svg += `<path d="${fatia(ang, a1, 104, 66)}" fill="${f.cor}" data-i="${i}"></path>`;
    ang = a1;
  });
  const rotuloCentro = visaoGrafico === "geral" ? "total" : `${pctBR(total / totalGeral)} da carteira`;
  h += `<div class="grafico" id="grafico">
    <svg viewBox="0 0 220 220" role="img" aria-label="Distribuição da carteira: ${esc(fatias.map((f) => `${f.nome} ${pctBR(f.valor / total)}`).join(", "))}">${svg}
      <text x="110" y="108" text-anchor="middle" class="centro-valor">R$ ${moedaBR(total)}</text>
      <text x="110" y="128" text-anchor="middle" class="centro-rotulo">${esc(rotuloCentro)}</text></svg>
    <ul class="legenda-grafico">${fatias.map((f, i) => `<li data-i="${i}"><i style="background:${f.cor}"></i><span>${esc(f.nome)}</span><span>${moedaBR(f.valor)}</span><span>${pctBR(f.valor / total)}</span></li>`).join("")}</ul>
  </div>`;
  bloco.innerHTML = h;
  ligarVisoes(d);

  // Passar o mouse numa fatia ou na legenda destaca as duas e mostra o valor.
  const g = $("#grafico");
  let dica = document.querySelector(".dica");
  if (!dica) { dica = document.createElement("div"); dica.className = "dica"; dica.hidden = true; document.body.appendChild(dica); }
  const focar = (i, ev) => {
    g.classList.toggle("foco", i !== null);
    g.querySelectorAll("[data-i]").forEach((el) => el.classList.toggle("ativa", el.dataset.i === String(i)));
    if (i === null || !ev || ev.target.tagName !== "path") { dica.hidden = true; return; }
    const f = fatias[i];
    dica.textContent = `${f.nome} · R$ ${moedaBR(f.valor)} · ${pctBR(f.valor / total)}`;
    dica.hidden = false;
    dica.style.left = ev.clientX + 14 + "px";
    dica.style.top = ev.clientY + 14 + "px";
  };
  g.addEventListener("mousemove", (ev) => { const el = ev.target.closest("[data-i]"); focar(el ? Number(el.dataset.i) : null, ev); });
  g.addEventListener("mouseleave", () => focar(null));
}

function ligarVisoes(d) {
  document.querySelectorAll("#bloco-grafico [data-visao]").forEach((b) => {
    b.onclick = () => { visaoGrafico = b.dataset.visao; document.querySelector(".dica")?.setAttribute("hidden", ""); desenharGrafico(d); };
  });
}

// ---------- Evolução ----------
// Cor fixa por série (nunca pela posição na lista): desligar uma não repinta as outras.
const CORES_EVOLUCAO = { carteira: "var(--serie-1)", ibov: "var(--serie-2)", cdi: "var(--serie-3)", ipca: "var(--serie-4)", sp500: "var(--serie-5)", ifix: "var(--serie-6)" };
const PERIODOS = [["12m", "12 meses"], ["ano", "No ano"], ["2a", "2 anos"], ["5a", "5 anos"], ["tudo", "Tudo"]];
let periodoEvolucao = "12m";
let seriesLigadas = new Set(["carteira", "ibov", "cdi"]);
try { const s = JSON.parse(localStorage.getItem("seriesEvolucao")); if (Array.isArray(s) && s.length) seriesLigadas = new Set(s); } catch {}
try { const p = localStorage.getItem("periodoEvolucao"); if (PERIODOS.some(([v]) => v === p)) periodoEvolucao = p; } catch {}
const pct1 = (f) => (f > 0 ? "+" : "") + (f * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
const MESES_CURTOS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const dataBR = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;

async function abaEvolucao() {
  if (!cache.evolucao) {
    carregando("Calculando a evolução… (na primeira vez baixa o CDI, o IPCA e os preços do Tesouro)");
    try { cache.evolucao = await api("/api/evolucao"); } catch (e) { return erro(e); }
  }
  if (abaAtual !== "evolucao") return;
  const d = cache.evolucao;
  if (d.vazia) { $("#conteudo").innerHTML = `<section class="bloco"><p>Sem operações para calcular a evolução.</p></section>`; return; }

  const ini = inicioPeriodo(d, periodoEvolucao);
  const ult = d.datas.length - 1;
  const ret = (s) => retornoSerie(s.valores, ini, ult);
  const todasLigadas = d.series.every((s) => seriesLigadas.has(s.chave));
  let h = `<div class="controles-evolucao">
    <div class="visoes" role="group" aria-label="Período">${PERIODOS.map(([v, r]) => `<button data-periodo="${v}" aria-pressed="${periodoEvolucao === v}">${r}</button>`).join("")}</div>
    <div class="chips" role="group" aria-label="Linhas do gráfico">${d.series.map((s) => `<button data-serie="${s.chave}" aria-pressed="${seriesLigadas.has(s.chave)}" title="${esc(s.fonte)}"><i style="background:${CORES_EVOLUCAO[s.chave]}"></i>${esc(s.nome)}</button>`).join("")}
      <button data-serie="*" title="${todasLigadas ? "Deixa só a carteira" : "Liga todas as linhas"}">${todasLigadas ? "Só a carteira" : "Todas"}</button></div>
  </div>`;
  const rc = ret(d.series[0]);
  h += `<div class="cards">
    <div class="card"><div class="rotulo">Carteira</div><div class="valor ${cor(rc ?? 0)}">${rc == null ? "-" : pct1(rc)}</div><div class="sub">${esc(dataBR(d.datas[ini]))} a ${esc(d.ate)}</div></div>
    ${d.series.slice(1).filter((s) => seriesLigadas.has(s.chave)).map((s) => {
      const r = ret(s);
      const dif = r != null && rc != null ? `<div class="sub">carteira ${rc >= r ? "acima" : "abaixo"} em ${(Math.abs(rc - r) * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} p.p.</div>` : "";
      return `<div class="card"><div class="rotulo">${esc(s.nome)}</div><div class="valor">${r == null ? "-" : pct1(r)}</div>${dif}</div>`;
    }).join("")}
  </div>`;
  const patIni = d.patrimonio[ini], pat = d.patrimonio[ult], aportes = d.investido[ult] - d.investido[ini];
  h += `<section class="bloco"><h2>Rentabilidade <small>acumulada no período · método de cotas: aporte não conta como ganho</small></h2><div class="linha-grafico" id="graf-rent"></div></section>`;
  h += `<section class="bloco"><h2>Patrimônio <small>em R$ · no período: começou com ${esc(moedaBR(patIni))}, entraram ${esc(moedaBR(aportes))} (compras − vendas) e vale ${esc(moedaBR(pat))} · a linha tracejada é quanto valeria sem nenhum rendimento</small></h2><div class="linha-grafico" id="graf-pat"></div></section>`;

  h += `<section class="bloco"><h2>Por ano <small>* ano incompleto</small></h2><div class="rolagem"><table><thead><tr><th></th>${d.series.map((s, i) => `<th class="${i === 0 ? "destaque" : ""}">${esc(s.nome)}</th>`).join("")}</tr></thead><tbody>
    ${d.rentabilidade.map((l) => `<tr><td>${esc(l.periodo)}${l.parcial ? "*" : ""}</td>${l.valores.map((v, i) => `<td class="${i === 0 ? "destaque " : ""}${l.nums[i] == null ? "sem" : cor(l.nums[i])}">${esc(v)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <details style="margin-top:12px"><summary style="cursor:pointer">Como é calculado</summary>
      <p class="legenda">A carteira segue o <b>método de cotas</b>, o mesmo dos fundos. No primeiro dia ela vale 1 cota, e o rendimento de cada pregão é (valor de hoje − dinheiro que entrou hoje) ÷ valor de ontem, com "dinheiro que entrou" = compras − vendas − proventos recebidos. Assim aporte não vira ganho, e provento conta como rendimento. Ativos e operações de terceiros ficam de fora. As datas são as do extrato da B3, que traz a liquidação (D+1), não o dia do pregão.</p>
      <ul class="notas">${d.series.map((s) => `<li><b>${esc(s.nome)}</b>: ${esc(s.fonte)}</li>`).join("")}</ul>
      <p class="legenda">Os ETFs cobram taxa de administração, então rendem um pouco abaixo do índice. O IPCA sai por volta do dia 10 do mês seguinte, e a linha para no último mês publicado.</p></details>
    ${lista("Observações", d.notas)}</section>`;
  $("#conteudo").innerHTML = h;

  document.querySelectorAll("[data-periodo]").forEach((b) => b.onclick = () => {
    periodoEvolucao = b.dataset.periodo;
    try { localStorage.setItem("periodoEvolucao", periodoEvolucao); } catch {}
    abaEvolucao();
  });
  document.querySelectorAll("[data-serie]").forEach((b) => b.onclick = () => {
    const k = b.dataset.serie;
    if (k === "*") seriesLigadas = todasLigadas ? new Set(["carteira"]) : new Set(d.series.map((s) => s.chave));
    else if (seriesLigadas.has(k)) seriesLigadas.delete(k);
    else seriesLigadas.add(k);
    try { localStorage.setItem("seriesEvolucao", JSON.stringify([...seriesLigadas])); } catch {}
    abaEvolucao();
  });
  desenharEvolucao(d, ini);
}

// inicioPeriodo: índice do pregão base (o retorno conta a partir do fechamento dele).
// "No ano" usa o último pregão do ano anterior, como a tabela por ano.
function inicioPeriodo(d, p) {
  const n = d.datas.length, ult = d.datas[n - 1];
  if (p === "tudo") return 0;
  let corte;
  if (p === "ano") corte = `${Number(ult.slice(0, 4)) - 1}-12-31`;
  else corte = `${Number(ult.slice(0, 4)) - { "12m": 1, "2a": 2, "5a": 5 }[p]}${ult.slice(4)}`;
  let i = 0;
  while (i + 1 < n && d.datas[i + 1] <= corte) i++;
  return i;
}
// retornoSerie: do primeiro valor a partir de ini até o último que houver.
function retornoSerie(v, ini, fim) {
  let a = ini; while (a <= fim && v[a] == null) a++;
  let b = fim; while (b > a && v[b] == null) b--;
  return b > a && v[a] ? v[b] / v[a] - 1 : null;
}

// marcasEixo: passo "redondo" (1, 2, 2,5, 5 × 10^k) para ter umas 5 marcas.
function marcasEixo(min, max, qtd) {
  if (min === max) { min -= Math.abs(min) * 0.1 || 1; max += Math.abs(max) * 0.1 || 1; }
  const bruto = (max - min) / qtd, pot = Math.pow(10, Math.floor(Math.log10(bruto)));
  const passo = [1, 2, 2.5, 5, 10].map((m) => m * pot).find((p) => p >= bruto);
  const marcas = [];
  for (let v = Math.floor(min / passo) * passo; v < max + passo * 0.999; v += passo) marcas.push(Math.round(v / passo) * passo);
  return marcas;
}

function desenharEvolucao(d, ini) {
  const fim = d.datas.length - 1;
  const datas = d.datas.slice(ini);
  // Rentabilidade: cada série rebaseada em 0% no começo do período.
  const linhas = d.series.filter((s) => seriesLigadas.has(s.chave)).map((s) => {
    let a = ini; while (a <= fim && s.valores[a] == null) a++;
    const base = s.valores[a];
    return { nome: s.nome, cor: CORES_EVOLUCAO[s.chave], principal: s.chave === "carteira",
      v: s.valores.slice(ini).map((x) => (x == null || !base ? null : x / base - 1)) };
  });
  graficoLinhas($("#graf-rent"), datas, linhas, { pct: true, zero: true, rotulos: linhas.length <= 4 });
  graficoLinhas($("#graf-pat"), datas, [
    { nome: "Patrimônio", cor: "var(--serie-1)", principal: true, v: d.patrimonio.slice(ini) },
    // Quanto haveria se nada tivesse rendido: o patrimônio do começo mais o que entrou (compras − vendas).
    { nome: "Sem rendimento", cor: "var(--suave)", tracejado: true, v: d.investido.slice(ini).map((x) => d.patrimonio[ini] + x - d.investido[ini]) },
  ], { pct: false, zero: true, rotulos: true });
}

// graficoLinhas desenha linhas em SVG: eixo de datas, marcas no eixo Y,
// rótulo no fim de cada linha (até 4) e mira com dica ao passar o mouse ou o dedo.
function graficoLinhas(el, datas, linhas, op) {
  if (!el) return;
  const fmt = op.pct ? pct1 : (v) => "R$ " + moedaBR(v);
  const fmtEixo = op.pct
    ? (v) => (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%"
    : (v) => (Math.abs(v) >= 1000 ? (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : v.toLocaleString("pt-BR"));
  if (!linhas.length) { el.innerHTML = `<p class="legenda">Ligue ao menos uma linha nos botões acima.</p>`; return; }
  const W = Math.max(280, el.clientWidth), estreito = W < 560;
  const H = estreito ? 240 : 320, me = estreito ? 46 : 58, md = op.rotulos ? (estreito ? 64 : 170) : 14, mt = 10, mb = 26;
  const n = datas.length;
  let min = Infinity, max = -Infinity;
  for (const l of linhas) for (const x of l.v) if (x != null) { min = Math.min(min, x); max = Math.max(max, x); }
  if (!isFinite(min)) { el.innerHTML = `<p class="legenda">Sem dados no período.</p>`; return; }
  if (op.zero) { min = Math.min(min, 0); max = Math.max(max, 0); }
  const marcas = marcasEixo(min, max, estreito ? 4 : 5);
  const y0 = marcas[0], y1 = marcas[marcas.length - 1];
  const X = (i) => me + (n > 1 ? (i / (n - 1)) * (W - me - md) : 0);
  const Y = (v) => mt + (1 - (v - y0) / (y1 - y0)) * (H - mt - mb);

  let svg = marcas.map((m) => `<line class="${op.zero && Math.abs(m) < 1e-12 ? "zero" : "grade"}" x1="${me}" x2="${W - md}" y1="${Y(m)}" y2="${Y(m)}"></line><text class="eixo" x="${me - 8}" y="${Y(m) + 4}" text-anchor="end">${fmtEixo(m)}</text>`).join("");
  // Datas no eixo X: anos (período longo) ou meses.
  const anos = (Date.parse(datas[n - 1]) - Date.parse(datas[0])) / 3.156e10;
  const passoMes = anos > 2.5 ? 12 : anos > 1.2 ? 3 : anos > 0.5 ? 2 : 1;
  let ultimaX = -Infinity;
  for (let i = 1; i < n; i++) {
    if (datas[i].slice(0, 7) === datas[i - 1].slice(0, 7)) continue;
    const mes = Number(datas[i].slice(5, 7)) - 1;
    if (mes % passoMes) continue;
    const x = X(i);
    if (x - ultimaX < 52) continue;
    ultimaX = x;
    const txt = passoMes === 12 ? datas[i].slice(0, 4) : `${MESES_CURTOS[mes]}/${datas[i].slice(2, 4)}`;
    svg += `<line class="grade" x1="${x}" x2="${x}" y1="${H - mb}" y2="${H - mb + 4}"></line><text class="eixo" x="${x}" y="${H - 6}" text-anchor="middle">${txt}</text>`;
  }
  // Linhas (a principal por cima).
  const ordem = [...linhas].sort((a, b) => (a.principal ? 1 : 0) - (b.principal ? 1 : 0));
  for (const l of ordem) {
    let dd = "", caneta = false;
    l.v.forEach((x, i) => {
      if (x == null) { caneta = false; return; }
      dd += `${caneta ? "L" : "M"}${X(i).toFixed(1)},${Y(x).toFixed(1)}`;
      caneta = true;
    });
    svg += `<path class="serie${l.principal ? " principal" : ""}" d="${dd}" stroke="${l.cor}"${l.tracejado ? ' stroke-dasharray="6 4"' : ""}></path>`;
  }
  // Rótulo no fim de cada linha, afastando os que se encostam.
  if (op.rotulos) {
    const fins = linhas.map((l) => {
      let i = l.v.length - 1; while (i >= 0 && l.v[i] == null) i--;
      return i < 0 ? null : { l, i, y: Y(l.v[i]) };
    }).filter(Boolean).sort((a, b) => a.y - b.y);
    for (let k = 1; k < fins.length; k++) fins[k].y = Math.max(fins[k].y, fins[k - 1].y + 15);
    const excesso = fins.length ? fins[fins.length - 1].y - (H - mb) : 0;
    if (excesso > 0) fins.forEach((f) => (f.y -= excesso));
    for (const f of fins) {
      svg += `<circle cx="${X(f.i)}" cy="${Y(f.l.v[f.i])}" r="3.5" fill="${f.l.cor}"></circle><text class="rotulo-fim" x="${X(n - 1) + 8}" y="${f.y + 4}">${esc(estreito ? "" : f.l.nome + " ")}${fmt(f.l.v[f.i])}</text>`;
    }
  }
  svg += `<g class="mira-grupo" style="display:none"><line class="mira" y1="${mt}" y2="${H - mb}"></line>${linhas.map((l) => `<circle class="ponto" r="4.5" fill="${l.cor}"></circle>`).join("")}</g>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(linhas.map((l) => l.nome).join(", "))}">${svg}</svg>`;

  // Mira: o pregão mais perto do ponteiro, com o valor de cada linha.
  const s = el.querySelector("svg"), g = el.querySelector(".mira-grupo");
  const pontos = g.querySelectorAll("circle"), mira = g.querySelector("line");
  let dica = document.querySelector(".dica");
  if (!dica) { dica = document.createElement("div"); dica.className = "dica"; dica.hidden = true; document.body.appendChild(dica); }
  const sair = () => { g.style.display = "none"; dica.hidden = true; };
  const mover = (ev) => {
    const r = s.getBoundingClientRect();
    const x = ((ev.clientX - r.left) / r.width) * W;
    if (x < me - 6 || x > W - md + 6) { sair(); return; }
    const i = Math.max(0, Math.min(n - 1, Math.round(((x - me) / (W - me - md)) * (n - 1))));
    g.style.display = "";
    mira.setAttribute("x1", X(i)); mira.setAttribute("x2", X(i));
    const valores = [];
    linhas.forEach((l, k) => {
      const v = l.v[i];
      pontos[k].style.display = v == null ? "none" : "";
      if (v == null) return;
      pontos[k].setAttribute("cx", X(i)); pontos[k].setAttribute("cy", Y(v));
      valores.push({ l, v });
    });
    valores.sort((a, b) => b.v - a.v);

    dica.hidden = false;
    const esquerda = ev.clientX + 16 + dica.offsetWidth > window.innerWidth;
    dica.style.left = (esquerda ? ev.clientX - dica.offsetWidth - 16 : ev.clientX + 16) + "px";
    dica.style.top = Math.max(8, ev.clientY - dica.offsetHeight - 12) + "px";
  };
  s.addEventListener("pointermove", mover);
  s.addEventListener("pointerdown", mover);
  s.addEventListener("pointerleave", sair);
}

// ---------- Radar ----------
// radarMinimo: nota mínima mostrada (quantos critérios cumpre); 0 = todas.
let radarMinimo = 6, radarBusca = "";
// Ordenação do radar: coluna "nota" (padrão do servidor), "ativo", "ev" ou o índice do critério.
let radarOrdem = { col: "nota", cresce: false };

// numeroBR lê "11,6%", "5 anos", "1.234,5"; sem número (n/a, -) devolve null.
function numeroBR(txt) {
  const m = String(txt).replace(/\./g, "").replace(",", ".").match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}
function chaveRadar(i, col) {
  if (col === "ativo") return i.ticker;
  if (col === "nota") return i.total ? i.cumpridos / i.total : 0;
  if (col === "ev") return numeroBR(i.evEbitda);
  if (col === "pvp") return numeroBR(i.pvp);
  if (col === "fila") return numeroBR(i.fila);
  if (col === "setor") return i.setor || null;
  const c = i.criterios[col];
  return c && !c.naoAplica ? numeroBR(c.valor) : null;
}
function ordenarRadar(itens) {
  const { col, cresce } = radarOrdem;
  if (col === "nota" && !cresce) return itens; // o servidor já manda na ordem da nota (e fila no empate)
  return [...itens].sort((x, y) => {
    const a = chaveRadar(x, col), b = chaveRadar(y, col);
    if (a === null && b === null) return 0;
    if (a === null) return 1; // sem valor sempre no fim
    if (b === null) return -1;
    const r = typeof a === "string" ? a.localeCompare(b) : a - b;
    return cresce ? r : -r;
  });
}
function cabecalhoRadar(rotulo, col, alinhar) {
  const ativa = radarOrdem.col === col;
  const seta = ativa ? (radarOrdem.cresce ? " ▲" : " ▼") : "";
  return `<th class="ordenavel${ativa ? " ordenada" : ""}" data-col="${col}"${alinhar ? ` style="text-align:${alinhar}"` : ""} title="Ordenar">${esc(rotulo)}${seta}</th>`;
}
async function abaRadar() {
  if (!cache.radar) {
    $("#conteudo").innerHTML = `<section class="bloco"><h2>Radar</h2><p>Avalia todas as ações da B3 com liquidez pelo seu filtro. Na primeira vez baixa os eventos de cada empresa no site da B3 e pode levar vários minutos.</p><button class="principal" id="rodar-radar">Calcular o radar</button></section>`;
    $("#rodar-radar").onclick = async () => {
      carregando("Calculando o radar… (pode levar alguns minutos)");
      try { cache.radar = await api("/api/radar"); } catch (e) { if (abaAtual === "radar") erro(e); return; }
      if (abaAtual === "radar") abaRadar();
    };
    return;
  }
  const d = cache.radar;
  const busca = radarBusca.toUpperCase();
  // Banco tem menos critérios (sem ROIC): a nota mínima vale como proporção.
  const nCrit = d.criterios.length;
  const passa = (i) => !radarMinimo || (i.total && i.cumpridos / i.total >= radarMinimo / nCrit - 1e-9);
  // Na busca aparecem todas, para achar qualquer ação.
  const itens = ordenarRadar(d.itens.filter((i) => busca ? i.ticker.includes(busca) || (i.nome || "").toUpperCase().includes(busca) : passa(i)));
  const opcoes = [];
  for (let n = nCrit; n >= 1; n--) opcoes.push(`<option value="${n}"${radarMinimo === n ? " selected" : ""}>Nota ${n}/${nCrit} ou mais (${d.itens.filter((i) => i.total && i.cumpridos / i.total >= n / nCrit - 1e-9).length})</option>`);
  opcoes.push(`<option value="0"${radarMinimo === 0 ? " selected" : ""}>Todas (${d.itens.length})</option>`);
  let h = `<div class="linha-form"><input type="text" id="busca-radar" placeholder="Procurar ativo ou empresa" value="${esc(radarBusca)}">
    <select id="radar-minimo" title="Esconde as de nota baixa">${opcoes.join("")}</select><button id="radar-atualizar">Calcular de novo</button></div>`;
  h += `<section class="bloco"><h2>Radar <small>${esc(d.data)} · ${d.analisadas} empresas · ${d.semLiquidez} códigos sem liquidez ficaram fora · preços até ${esc(d.precosAte)}</small></h2>
    <div class="rolagem"><table id="tabela-radar"><thead><tr>${cabecalhoRadar("Ativo", "ativo", "left")}${cabecalhoRadar("Nota", "nota")}${d.criterios.map((c, ic) => cabecalhoRadar(c, ic)).join("")}${cabecalhoRadar("EV/EBITDA", "ev")}${cabecalhoRadar("P/VP", "pvp")}${cabecalhoRadar("Fila", "fila")}${cabecalhoRadar("Setor", "setor", "left")}<th style="text-align:left">Obs.</th></tr></thead><tbody>`;
  for (const i of itens) {
    h += `<tr><td title="${esc(i.nome)}">${esc(i.ticker)}${i.naCarteira ? ` <span class="etiqueta">na carteira</span>` : ""}</td><td class="nota-radar">${i.cumpridos}/${i.total}</td>
      ${i.criterios.map((c) => `<td class="${c.naoAplica ? "sem" : c.ok ? "ok" : "nok"}">${esc(c.valor)} ${c.naoAplica ? "" : c.ok ? "✓" : "✗"}</td>`).join("")}<td class="sem">${esc(i.evEbitda || "-")}</td><td class="sem">${esc(i.pvp || "-")}</td><td class="sem">${esc(i.fila || "-")}</td><td class="sem" style="text-align:left">${esc(i.setor || "-")}</td><td style="text-align:left">${esc(i.obs)}</td></tr>`;
  }
  h += `</tbody></table></div><p class="legenda">${busca ? "Na busca aparecem todas as notas. " : itens.length ? "" : "Nenhuma ação com essa nota. "}Nenhum critério elimina sozinho: a nota é quantos o ativo cumpre · n/a = não se aplica (ROIC e dívida de banco) · na mesma nota, menor fila primeiro (40% ROIC de 3 anos, 40% preço: P/L e P/VP, 20% beta) · EV/EBITDA, P/VP e setor não entram na nota · P/L com o último fechamento do COTAHIST · limites: <code>carteira filtro</code></p>${lista("Observações", d.notas)}</section>`;
  $("#conteudo").innerHTML = h;
  const b = $("#busca-radar");
  b.oninput = () => { radarBusca = b.value; abaRadar(); const nb = $("#busca-radar"); nb.focus(); nb.setSelectionRange(nb.value.length, nb.value.length); };
  $("#radar-minimo").onchange = (ev) => { radarMinimo = Number(ev.target.value); abaRadar(); };
  $("#tabela-radar thead").onclick = (ev) => {
    const th = ev.target.closest("th[data-col]");
    if (!th) return;
    const col = /^\d+$/.test(th.dataset.col) ? Number(th.dataset.col) : th.dataset.col;
    // 1º clique: do maior para o menor (nota, ROE…), exceto texto e os números em que menor é melhor (P/L, dívida, beta, fila…).
    const menorPrimeiro = ["ativo", "ev", "pvp", "fila", "setor"].includes(col) || (typeof col === "number" && /P\/L|beta|correl|d[ií]vida/i.test(d.criterios[col]));
    radarOrdem = radarOrdem.col === col ? { col, cresce: !radarOrdem.cresce } : { col, cresce: menorPrimeiro };
    abaRadar();
  };
  $("#radar-atualizar").onclick = () => { delete cache.radar; abaRadar(); $("#rodar-radar").click(); };
}

// ---------- tema ----------
function aplicarTema(t) { if (t) document.documentElement.dataset.tema = t; else delete document.documentElement.dataset.tema; }
try { aplicarTema(localStorage.getItem("tema")); } catch {}
$("#tema").onclick = () => {
  const escuroAgora = getComputedStyle(document.documentElement).getPropertyValue("--fundo").trim() === "#12161c";
  const novo = escuroAgora ? "claro" : "escuro";
  aplicarTema(novo);
  try { localStorage.setItem("tema", novo); } catch {}
};

// ---------- início ----------
(async () => {
  // A posição sempre carrega: é dela que vem o aviso de mês novo.
  try { cache.posicao = await api("/api/posicao"); $("#data").textContent = cache.posicao.data; } catch {}
  const pedida = location.hash.slice(1);
  abrirAba(ABAS.includes(pedida) ? pedida : "carteira");
  if (cache.posicao && cache.posicao.mesNovo) mostrarAvisoMes();
})();
</script>
</body>
</html>
